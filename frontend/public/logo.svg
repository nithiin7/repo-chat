<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Magnifying glass icon -->
  <circle cx="30" cy="30" r="15" fill="#4f46e5"/>
  <!-- Code lines inside lens -->
  <rect x="21" y="23" width="12" height="3" rx="1.5" fill="white"/>
  <rect x="21" y="28.5" width="17" height="3" rx="1.5" fill="white"/>
  <rect x="21" y="34" width="9" height="3" rx="1.5" fill="white"/>
  <!-- Handle -->
  <line x1="41" y1="41" x2="50" y2="50" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text
    x="68" y="38"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    fill="#1e293b"
  >Code<tspan fill="#4f46e5">Lens</tspan></text>
</svg>
